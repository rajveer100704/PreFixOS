name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Binary
        run: CGO_ENABLED=0 go build -o bin/prefixos cmd/server/main.go
