apiVersion: v1
kind: Service
metadata:
  name: prefixos-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: prefixos
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
