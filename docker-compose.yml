version: '3.8'

services:
  prefixos-node1:
    build: .
    container_name: prefixos-node1
    ports:
      - "50051:50051"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - prefixos-data1:/var/lib/prefixos
    networks:
      - prefixos-net

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prefixos-prometheus
    ports:
      - "9091:9090"
    networks:
      - prefixos-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: prefixos-grafana
    ports:
      - "3000:3000"
    networks:
      - prefixos-net

volumes:
  prefixos-data1:

networks:
  prefixos-net:
    driver: bridge
